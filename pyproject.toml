[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "accesstwin"
version = "0.1.0"
description = "Metric digital twins of workspaces, audited by disability-persona agents"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic>=2.7",
    "shapely>=2.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "rerun-sdk>=0.38.1",
    "pillow>=12.3.0",
]

[project.scripts]
accesstwin = "accesstwin.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["accesstwin"]
