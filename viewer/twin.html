<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AccessTwin Viewer</title>
<style>
  :root { --bg:#0d1117; --panel:rgba(22,27,34,.86); --text:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#58a6ff; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 Inter, -apple-system, Helvetica, Arial, sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:10px; backdrop-filter:blur(8px); }
  #title { top:16px; left:16px; padding:12px 16px; max-width:min(440px, calc(100vw - 32px)); }
  #title h1 { margin:0 0 2px; font-size:17px; font-weight:650; }
  #title p { margin:0; color:var(--muted); font-size:12.5px; }
  #views { top:16px; right:16px; padding:10px; display:flex; flex-direction:column; gap:6px; }
  #views button, #toggles label { font:inherit; font-size:12.5px; color:var(--text); background:#21262d; border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; text-align:left; }
  #views button:hover { border-color:var(--accent); }
  #toggles { bottom:16px; right:16px; padding:10px; display:flex; flex-direction:column; gap:6px; }
  #toggles input { margin-right:6px; }
  #legend { bottom:16px; left:16px; padding:10px 12px; display:grid; grid-template-columns:repeat(3, auto); gap:5px 14px; font-size:12px; }
  #legend span { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  #legend i { width:12px; height:12px; border-radius:3px; display:inline-block; }
  #tip { position:fixed; pointer-events:none; padding:6px 9px; font-size:12.5px; display:none; z-index:5; }
  @media (max-width: 760px) { #legend { grid-template-columns:repeat(2, auto); bottom:auto; top:110px; } #views { top:auto; bottom:16px; right:auto; left:16px; flex-direction:row; flex-wrap:wrap; max-width:calc(100vw - 150px);} #legend{display:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title" class="panel"><h1 id="name">AccessTwin</h1><p id="sub"></p></div>
<div id="views" class="panel"></div>
<div id="toggles" class="panel">
  <label><input type="checkbox" id="tSigns" checked>Station signs</label>
  <label><input type="checkbox" id="tCallouts">Floating callouts</label>
  <label><input type="checkbox" id="tWalls" checked>Walls</label>
  <label><input type="checkbox" id="tZones" checked>Zone floor colors</label>
  <label><input type="checkbox" id="tSpin">Auto-rotate</label>
</div>
<div id="legend" class="panel"></div>
<div id="tip" class="panel"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.2.0/dist/spark.module.js"
} }
</script>
<script id="spec" type="application/json">/*SPEC*/</script>
<script id="tour" type="application/json">/*TOUR*/</script>
<script id="specB" type="application/json">/*SPECB*/</script>
<script id="audit" type="application/json">/*AUDIT*/</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const spec = JSON.parse(document.getElementById("spec").textContent);
document.getElementById("name").textContent = spec.name;
const xs = spec.outline.map(p => p[0]), ys = spec.outline.map(p => p[1]);
const W = Math.max(...xs), D = Math.max(...ys), H = spec.ceiling_height;
document.getElementById("sub").textContent =
  `${W.toFixed(1)} × ${D.toFixed(1)} m room from the iPhone LiDAR scan · ${spec.elements.length} stations · drag to orbit, scroll to zoom`;

// ---------- renderer / scene ----------
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
const P = (x, y, z = 0) => new THREE.Vector3(x, z, -y); // plan (x, y) + height z -> three

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3328, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.copy(P(W * 0.3, -D * 0.4, 14));
sun.target.position.copy(P(W / 2, D / 2, 0));
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

// ---------- materials ----------
const M = {};
const mat = (key, color, o = {}) => (M[key] ??= new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.05, ...o }));
const steel = () => mat("steel", 0xb8bec6, { metalness: 0.75, roughness: 0.35 });
const dark = () => mat("dark", 0x2b2f36, { roughness: 0.5 });
const black = () => mat("black", 0x15171b, { roughness: 0.45 });
const wood = () => mat("wood", 0xc8a77e, { roughness: 0.7 });
const white = () => mat("white", 0xf2f2ef, { roughness: 0.55 });
const glass = () => mat("glass", 0xaad4ff, { transparent: true, opacity: 0.22, roughness: 0.05, metalness: 0.1 });
const screen = () => mat("screen", 0x1d4ed8, { emissive: 0x2a62ff, emissiveIntensity: 0.6, roughness: 0.2 });
const esd = () => mat("esd", 0x3c6fa8, { roughness: 0.8 });
const urBlue = () => mat("ur", 0x9fb7c9, { metalness: 0.3, roughness: 0.4 });
const orange = () => mat("kuka", 0xf28c28, { metalness: 0.2, roughness: 0.45 });
const yellow = () => mat("yellow", 0xf5c400, { roughness: 0.5 });
const red = () => mat("red", 0xd1242f, { roughness: 0.45 });
const green = () => mat("green", 0x1f9d55, { roughness: 0.5 });

function box(w, h, d, m, x = 0, y = 0, z = 0, parent) {
  const g = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  g.position.set(x, y + h / 2, z); g.castShadow = g.receiveShadow = true;
  parent?.add(g); return g;
}
function cyl(r1, r2, h, m, x = 0, y = 0, z = 0, parent, seg = 24) {
  const g = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), m);
  g.position.set(x, y + h / 2, z); g.castShadow = g.receiveShadow = true;
  parent?.add(g); return g;
}
function sphere(r, m, x, y, z, parent) {
  const g = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), m);
  g.position.set(x, y, z); g.castShadow = true; parent?.add(g); return g;
}
// A capsule limb from a to b (Vector3s in the parent's frame).
function limb(a, b, r, m, parent) {
  const len = a.distanceTo(b);
  const g = new THREE.Mesh(new THREE.CapsuleGeometry(r, Math.max(len - 2 * r, 0.001), 6, 12), m);
  g.position.copy(a).add(b).multiplyScalar(0.5);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  g.castShadow = true; parent.add(g); return g;
}
function gridTexture(color, bg, cells = 8, line = 2, alpha = true) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d");
  if (bg) { x.fillStyle = bg; x.fillRect(0, 0, 256, 256); }
  x.strokeStyle = color; x.lineWidth = line;
  for (let i = 0; i <= cells; i++) { const p = (i * 256) / cells; x.beginPath(); x.moveTo(p, 0); x.lineTo(p, 256); x.stroke(); x.beginPath(); x.moveTo(0, p); x.lineTo(256, p); x.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
function stripeTexture() {
  const c = document.createElement("canvas"); c.width = 128; c.height = 16;
  const x = c.getContext("2d"); x.fillStyle = "#f5c400"; x.fillRect(0, 0, 128, 16); x.fillStyle = "#111";
  for (let i = -16; i < 144; i += 32) { x.beginPath(); x.moveTo(i, 16); x.lineTo(i + 16, 0); x.lineTo(i + 32, 0); x.lineTo(i + 16, 16); x.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ---------- room ----------
const signs = [];
const floorTex = gridTexture("rgba(0,0,0,.05)", "#9a9a96", 1, 2);
floorTex.repeat.set(W, D);
const shape = new THREE.Shape(spec.outline.map(([x, y]) => new THREE.Vector2(x, y)));
const floor = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshStandardMaterial({ color: 0xb9b7b0, roughness: 0.35, metalness: 0.0 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);

const walls = new THREE.Group(); scene.add(walls);
const wallMat = new THREE.MeshStandardMaterial({ color: 0xe9e6df, roughness: 0.9 });
const capMat = new THREE.MeshStandardMaterial({ color: 0x3b4048, roughness: 0.6 });
const WALL_H = 2.6, T = 0.15;
const fadeWalls = [], exitSigns = [];
const ring = [...spec.outline, spec.outline[0]];
const ccw = spec.outline.reduce((a, p, i) => { const q = spec.outline[(i + 1) % spec.outline.length]; return a + (p[0] * q[1] - q[0] * p[1]); }, 0) > 0;
for (let i = 0; i < ring.length - 1; i++) {
  const [ax, ay] = ring[i], [bx, by] = ring[i + 1];
  const len = Math.hypot(bx - ax, by - ay); if (len < 0.05) continue;
  const ux = (bx - ax) / len, uy = (by - ay) / len;
  // Cut door openings that sit on this wall line.
  const gaps = spec.doors.map(d => {
    const t = (d.position[0] - ax) * ux + (d.position[1] - ay) * uy;
    const off = Math.abs(-(d.position[0] - ax) * uy + (d.position[1] - ay) * ux);
    return off < 0.2 && t > 0 && t < len ? [t - d.clear_width / 2 - 0.05, t + d.clear_width / 2 + 0.05, d] : null;
  }).filter(Boolean).sort((a, b) => a[0] - b[0]);
  let s = 0; const pieces = [];
  for (const [g0, g1, d] of gaps) { pieces.push([s, g0, WALL_H]); pieces.push([g0, g1, null, d]); s = g1; }
  pieces.push([s, len, WALL_H]);
  for (const [t0, t1, h, d] of pieces) {
    if (t1 - t0 < 0.01) continue;
    // Shift the wall outward by half its thickness so its inner face sits on the scanned wall line.
    const ox = (ccw ? uy : -uy) * T / 2, oy = (ccw ? -ux : ux) * T / 2;
    const mx = ax + ux * (t0 + t1) / 2 + ox, my = ay + uy * (t0 + t1) / 2 + oy, ang = Math.atan2(uy, ux);
    if (h) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(t1 - t0, h, T), wallMat.clone());
      m.material.transparent = true;
      m.position.copy(P(mx, my, h / 2)); m.rotation.y = ang; m.castShadow = m.receiveShadow = true; walls.add(m);
      fadeWalls.push({ mesh: m, n: (ccw ? P(uy, -ux, 0) : P(-uy, ux, 0)).normalize(), mid: P(mx, my, 0) });
      const cap = new THREE.Mesh(new THREE.BoxGeometry(t1 - t0, 0.03, T + 0.01), capMat);
      cap.position.copy(P(mx, my, h)); cap.rotation.y = ang; walls.add(cap);
    } else {
      // Door: frame, header and a half-open leaf (open doorways get only the frame).
      const frame = new THREE.Group(); frame.position.copy(P(mx, my, 0)); frame.rotation.y = ang; walls.add(frame);
      const w = t1 - t0;
      box(0.06, 2.13, T + 0.02, dark(), -w / 2, 0, 0, frame); box(0.06, 2.13, T + 0.02, dark(), w / 2, 0, 0, frame);
      box(w, WALL_H - 2.13, T, wallMat, 0, 2.13, 0, frame);
      if (d.hardware !== "none") {
        const leaf = new THREE.Group(); leaf.position.set(-w / 2 + 0.05, 0, 0); frame.add(leaf);
        box(w - 0.1, 2.08, 0.045, mat("door", 0x8d6e4f, { roughness: 0.55 }), (w - 0.1) / 2, 0.02, 0, leaf);
        leaf.rotation.y = -0.9 * Math.sign(d.inward[0] * uy - d.inward[1] * ux || 1);
      }
      exitSigns.push([frame, d]);
    }
  }
}

// ---------- signs ----------
function signSprite(text, fg, bg, worldH = 0.22) {
  const c = document.createElement("canvas"); const x = c.getContext("2d");
  const fs = 64; x.font = `600 ${fs}px Inter, Helvetica, Arial, sans-serif`;
  const w = Math.ceil(x.measureText(text).width) + 56; c.width = w; c.height = fs + 40;
  x.font = `600 ${fs}px Inter, Helvetica, Arial, sans-serif`;
  x.fillStyle = bg; roundRect(x, 0, 0, w, c.height, 18); x.fill();
  x.strokeStyle = "rgba(0,0,0,.25)"; x.lineWidth = 3; x.stroke();
  x.fillStyle = fg; x.textBaseline = "middle"; x.fillText(text, 28, c.height / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false }));
  s.scale.set(worldH * w / c.height, worldH, 1); s.renderOrder = 10; return s;
}
function roundRect(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }

// ---------- people & robots ----------
function humanoid(parent, s = 1, m = mat("hum", 0xd9dde3, { metalness: 0.4, roughness: 0.35 })) {
  const g = new THREE.Group(); parent.add(g); g.scale.setScalar(s);
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  box(0.36, 0.42, 0.2, m, 0, 0.82, 0, g); box(0.3, 0.12, 0.18, dark(), 0, 0.72, 0, g);
  sphere(0.11, m, 0, 1.38, 0, g); box(0.16, 0.05, 0.02, screen(), 0, 1.36, 0.1, g);
  limb(V(-0.1, 0.72, 0), V(-0.1, 0.38, 0.04), 0.055, m, g); limb(V(-0.1, 0.38, 0.04), V(-0.1, 0.05, 0), 0.05, m, g);
  limb(V(0.1, 0.72, 0), V(0.1, 0.38, 0.04), 0.055, m, g); limb(V(0.1, 0.38, 0.04), V(0.1, 0.05, 0), 0.05, m, g);
  box(0.1, 0.05, 0.2, dark(), -0.1, 0, 0.03, g); box(0.1, 0.05, 0.2, dark(), 0.1, 0, 0.03, g);
  limb(V(-0.22, 1.2, 0), V(-0.26, 0.95, 0.05), 0.045, m, g); limb(V(-0.26, 0.95, 0.05), V(-0.24, 0.75, 0.15), 0.04, m, g);
  limb(V(0.22, 1.2, 0), V(0.26, 0.95, 0.05), 0.045, m, g); limb(V(0.26, 0.95, 0.05), V(0.24, 0.75, 0.15), 0.04, m, g);
  return g;
}
function quadruped(parent, m = mat("quad", 0xf2b01e, { roughness: 0.45 })) {
  const g = new THREE.Group(); parent.add(g); const V = (x, y, z) => new THREE.Vector3(x, y, z);
  box(0.75, 0.16, 0.26, m, 0, 0.38, 0, g); box(0.12, 0.08, 0.2, dark(), 0.4, 0.42, 0, g);
  for (const [x, z] of [[0.3, 0.14], [0.3, -0.14], [-0.3, 0.14], [-0.3, -0.14]]) {
    limb(V(x, 0.42, z), V(x + 0.08, 0.22, z), 0.035, dark(), g); limb(V(x + 0.08, 0.22, z), V(x - 0.02, 0.02, z), 0.03, dark(), g);
  }
  return g;
}
function amr(parent, x = 0, z = 0) {
  const g = new THREE.Group(); g.position.set(x, 0, z); parent.add(g);
  box(0.8, 0.3, 0.58, mat("amr", 0x30363d), 0, 0.04, 0, g); box(0.8, 0.02, 0.58, mat("amrTop", 0x58a6ff, { emissive: 0x1f6feb, emissiveIntensity: 0.25 }), 0, 0.34, 0, g);
  cyl(0.06, 0.06, 0.07, black(), 0.28, 0.36, 0, g); return g;
}
function drone(parent, x, y, z) {
  const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g);
  box(0.12, 0.03, 0.12, black(), 0, 0, 0, g);
  for (const [a, b] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) { cyl(0.07, 0.07, 0.005, mat("prop", 0x9be9a8, { transparent: true, opacity: 0.6 }), a * 0.09, 0.03, b * 0.09, g); }
  g.userData.spin = true; return g;
}
function arm(parent, scale, m, pose = [0.4, -0.9, 1.3, -0.4]) {
  // Six-axis arm: base, shoulder, upper arm, elbow, forearm, wrist, gripper.
  const g = new THREE.Group(); parent.add(g); g.scale.setScalar(scale);
  cyl(0.09, 0.1, 0.12, m, 0, 0, 0, g);
  const yaw = new THREE.Group(); yaw.position.y = 0.12; yaw.rotation.y = pose[0]; g.add(yaw);
  cyl(0.075, 0.075, 0.1, m, 0, 0, 0, yaw); sphere(0.075, dark(), 0, 0.14, 0, yaw);
  const sh = new THREE.Group(); sh.position.y = 0.14; sh.rotation.z = pose[1]; yaw.add(sh);
  limb(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0.42, 0), 0.06, m, sh); sphere(0.065, dark(), 0, 0.42, 0, sh);
  const el = new THREE.Group(); el.position.y = 0.42; el.rotation.z = pose[2]; sh.add(el);
  limb(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0.38, 0), 0.05, m, el); sphere(0.05, dark(), 0, 0.38, 0, el);
  const wr = new THREE.Group(); wr.position.y = 0.38; wr.rotation.z = pose[3]; el.add(wr);
  cyl(0.04, 0.04, 0.1, m, 0, 0, 0, wr); box(0.1, 0.03, 0.05, black(), 0, 0.1, 0, wr);
  box(0.015, 0.07, 0.04, black(), -0.035, 0.13, 0, wr); box(0.015, 0.07, 0.04, black(), 0.035, 0.13, 0, wr);
  g.userData.joints = { yaw, sh, el, wr, pose }; return g;
}
const animated = [];

// ---------- furniture builders (local frame: width on x, depth on z, front face at +z) ----------
function bench(g, w, d, top, kind) {
  const topMat = kind === "esd" ? esd() : kind === "steel" ? steel() : wood();
  box(w, 0.04, d, topMat, 0, top - 0.04, 0, g);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(0.05, top - 0.04, 0.05, dark(), sx * (w / 2 - 0.05), 0, sz * (d / 2 - 0.05), g);
  box(w - 0.1, 0.03, d - 0.1, dark(), 0, 0.15, 0, g);
  box(w, 0.7, 0.03, mat("riser", 0x8a929c, { metalness: 0.4 }), 0, top, -d / 2 + 0.02, g);
  box(w, 0.03, 0.28, steel(), 0, top + 0.42, -d / 2 + 0.15, g);
}
function benchKit(g, w, d, top, kit) {
  const z0 = -d / 2 + 0.17;
  if (kit.includes("scope")) { box(0.32, 0.17, 0.14, mat("scope", 0x3d4a5c), -w / 4, top + 0.45, z0, g); box(0.2, 0.12, 0.005, screen(), -w / 4 - 0.04, top + 0.475, z0 + 0.073, g); }
  if (kit.includes("psu")) { box(0.22, 0.13, 0.2, mat("psu", 0xe6e6e6), w / 4, top + 0.45, z0, g); }
  if (kit.includes("monitor")) { box(0.55, 0.32, 0.02, black(), 0, top + 0.12, -d / 2 + 0.25, g); box(0.52, 0.29, 0.005, screen(), 0, top + 0.135, -d / 2 + 0.262, g); box(0.04, 0.12, 0.04, dark(), 0, top, -d / 2 + 0.24, g); }
  if (kit.includes("solder")) {
    cyl(0.07, 0.07, 0.08, red(), w / 3, top, 0.05, g);
    const a = new THREE.Vector3(-w / 3, top + 0.7, -d / 2 + 0.05), b = new THREE.Vector3(-w / 3 + 0.15, top + 0.75, 0), c2 = new THREE.Vector3(-w / 3 + 0.25, top + 0.3, 0.12);
    limb(a, b, 0.035, mat("fume", 0xe85d2c), g); limb(b, c2, 0.035, mat("fume", 0xe85d2c), g); cyl(0.09, 0.06, 0.08, mat("fume", 0xe85d2c), -w / 3 + 0.25, top + 0.22, 0.12, g);
    box(0.35, 0.45, 0.3, mat("extractor", 0x6e7781), -w / 2 + 0.25, 0, 0, g);
  }
